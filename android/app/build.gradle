plugins { id 'com.android.application' }

android {
    namespace 'com.nfscarbon.android'
    compileSdk 36
    // Launcher-only build: the native libraries and the shader assets come from the upstream release APK
    // (unzip lib/ and assets/ into app/prebuilt/), SDL3's Java side from app/sdl-java.
    sourceSets {
        main.java.srcDirs += ["sdl-java"]
        main.jniLibs.srcDirs = ["prebuilt/lib"]
        main.assets.srcDirs = ["prebuilt/assets"]
    }
    defaultConfig {
        applicationId 'com.nfscarbon.android'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.3-en2'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Only libcarbonmods.so (the launcher's mod switches) is compiled here; everything else is prebuilt.
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/mods/CMakeLists.txt'; version '3.30.5' } }
    // adrenotools loads the namespace hooks from the extracted nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
