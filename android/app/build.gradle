plugins { id 'com.android.application' }

android {
    namespace 'com.nfscarbon.android'
    compileSdk 36
    // Launcher-only build: the native libraries and the shader assets come from the upstream release APK
    // (unzip lib/ and assets/ into app/prebuilt/), SDL3's Java side from app/sdl-java.
    sourceSets {
        main.java.srcDirs += ["sdl-java"]
        main.jniLibs.srcDirs = ["prebuilt/lib"]
        main.assets.srcDirs = ["prebuilt/assets"]
    }
    defaultConfig {
        applicationId 'com.nfscarbon.android'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.3-en1'
        ndk { abiFilters 'arm64-v8a' }
    }
    // adrenotools loads the namespace hooks from the extracted nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
